<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoZip Signup</title>
<link rel="icon" type="image/png" href="../Images/leaf.png" />
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
 <div class="top-controls">
  <button id="themeBtn">🌙</button>
  <button id="rtlBtn">RTL</button>
</div>

<div class="auth-container">

  <!-- LOGO -->
  <a href="../index/index.html" class="brand">
    <div class="logo-icon"><i class="fas fa-leaf"></i></div>
    <div>
      <h1>EcoZip</h1>
      <span>Adventure</span>
    </div>
  </a>

  <p class="tagline">Create your account and start the adventure.</p>

  <form class="auth-form">

    <h2>Sign Up</h2>

    <!-- NAME -->
    <div class="input-group">
      <input type="text" placeholder="Full Name" required>
    </div>

    <!-- EMAIL -->
    <div class="input-group">
      <input type="email" placeholder="Email address" required>
    </div>

    <!-- PASSWORD -->
    <div class="input-group password-group">
      <input type="password" id="signupPassword" placeholder="Password" required>
      <span class="toggle-password" data-target="signupPassword">
        <i class="fa-regular fa-eye"></i>
      </span>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div class="input-group password-group">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <span class="toggle-password" data-target="confirmPassword">
        <i class="fa-regular fa-eye"></i>
      </span>
    </div>

    <!-- TERMS -->
    <div class="options">
      <label class="checkbox">
        <input type="checkbox" required>
        <span></span>
        I agree to Terms & Conditions
      </label>
    </div>

    <!-- BUTTON -->
    <button type="submit" class="btn-primary">Create Account</button>

    <!-- SOCIAL -->
    <div class="social">
      <button class="social-btn google">
        <i class="fab fa-google"></i>
        Continue with Google
      </button>

      <button class="social-btn apple">
        <i class="fab fa-apple"></i>
        Continue with Apple
      </button>
    </div>

    <p class="switch-text">
      Already have an account?
      <a href="../login/login.html">Login</a>
    </p>

  </form>

</div>


<script>
// PASSWORD TOGGLE (MULTIPLE FIELDS)
document.querySelectorAll(".toggle-password").forEach(icon => {
  icon.onclick = () => {
    const input = document.getElementById(icon.dataset.target);

    input.type = input.type === "password" ? "text" : "password";
  };
});

// DARK MODE
document.getElementById("themeBtn").onclick = () => {
  document.body.classList.toggle("dark");
};

// RTL
document.getElementById("rtlBtn").onclick = () => {
  document.documentElement.dir =
    document.documentElement.dir === "rtl" ? "ltr" : "rtl";
};
</script>

</body>
</html>
