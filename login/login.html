<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecozip signup</title>
    <link rel="stylesheet" href="../login/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
 

<div class="auth-container">

  <h1 class="brand">Zipline Adventure</h1>
  <p class="tagline">Feel the thrill. Join the ride.</p>

  <div class="form-toggle">
    <button id="showLogin" class="active">Login</button>
    <button id="showSignup">Sign Up</button>
  </div>

  <form id="loginForm" class="auth-form active">
    <h2>Welcome Back</h2>

    <input type="email" placeholder="Enter your email" required>

    <div class="password-group">
      <input type="password" id="loginPassword" placeholder="Password" required>
      <span class="toggle-password" data-target="loginPassword">👁️</span>
    </div>

    <button type="submit">Start Adventure</button>

    <p class="switch-text">
      New here? <a href="#" id="switchToSignup">Create Account</a>
    </p>
  </form>

  <form id="signupForm" class="auth-form">
    <h2>Join the Adventure</h2>

    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>

    <div class="password-group">
      <input type="password" id="signupPassword" placeholder="Password" required>
      <span class="toggle-password" data-target="signupPassword">👁️</span>
      <div id="strength" class="password-strength"></div>
    </div>

    <div class="password-group">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <span class="toggle-password" data-target="confirmPassword">👁️</span>
    </div>

    <button type="submit">Join Now</button>

    <p class="switch-text">
      Already a member? <a href="#" id="switchToLogin">Login</a>
    </p>
  </form>

</div>

<script>
    const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

const showLogin = document.getElementById("showLogin");
const showSignup = document.getElementById("showSignup");

const switchToSignup = document.getElementById("switchToSignup");
const switchToLogin = document.getElementById("switchToLogin");

showLogin.onclick = () => {
  loginForm.classList.add("active");
  signupForm.classList.remove("active");
  showLogin.classList.add("active");
  showSignup.classList.remove("active");
};

showSignup.onclick = () => {
  signupForm.classList.add("active");
  loginForm.classList.remove("active");
  showSignup.classList.add("active");
  showLogin.classList.remove("active");
};

switchToSignup.onclick = (e) => {
  e.preventDefault();
  showSignup.click();
};

switchToLogin.onclick = (e) => {
  e.preventDefault();
  showLogin.click();
};

document.querySelectorAll(".toggle-password").forEach(icon => {
  icon.onclick = () => {
    const input = document.getElementById(icon.dataset.target);
    input.type = input.type === "password" ? "text" : "password";
  };
});

const password = document.getElementById("signupPassword");
const strength = document.getElementById("strength");

password.addEventListener("input", () => {
  let val = password.value;
  strength.className = "password-strength";

  if (val.length < 6) {
    strength.classList.add("weak");
  } else if (/[A-Z]/.test(val) && /[0-9]/.test(val)) {
    strength.classList.add("medium");
  } else if (/[^A-Za-z0-9]/.test(val)) {
    strength.classList.add("strong");
  }
});

const themeBtn = document.getElementById("themeBtn");

themeBtn.onclick = () => {
  document.body.classList.toggle("dark");

  themeBtn.textContent =
    document.body.classList.contains("dark") ? "☀️" : "🌙";
};
</script>
    </body>
    </html>
