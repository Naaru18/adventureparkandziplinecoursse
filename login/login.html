<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoZip Register</title>
 <link rel="icon" type="image/png" href="../Images/leaf.png" />
  <link rel="stylesheet" href="../login/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
 <div class="theme-toggle">
  <button id="themeBtn">🌙</button>
</div>
<div class="auth-container">

  
  <a href="../index/index.html" class="ez-brand">
    <span class="ez-logo-icon"><i class="fas fa-leaf"></i></span>
    <div class="ez-logo-text">
      <span class="ez-logo-main">EcoZip</span>
      <span class="ez-logo-sub">Adventure</span>
    </div>
  </a>

  <p class="tagline">Feel the thrill. Join the ride.</p>

  
  <form id="signupForm" class="auth-form active">

    <h2>Join the Adventure</h2>

    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>

    <div class="password-group">
      <input type="password" id="signupPassword" placeholder="Password" required>
      <span class="toggle-password" data-target="signupPassword">👁️</span>
      <div id="strength" class="password-strength"></div>
    </div>

    <div class="password-group">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <span class="toggle-password" data-target="confirmPassword">👁️</span>
    </div>

    <button type="submit">Join Now</button>

    
    <p class="switch-text">
      Already have an account?
      <a href="../login/register.html">Login here</a>
    </p>

  </form>

</div>

<script>
document.querySelectorAll(".toggle-password").forEach(icon => {
  icon.onclick = () => {
    const input = document.getElementById(icon.dataset.target);
    input.type = input.type === "password" ? "text" : "password";
  };
});

const password = document.getElementById("signupPassword");
const strength = document.getElementById("strength");

password.addEventListener("input", () => {
  let val = password.value;
  strength.className = "password-strength";

  if (val.length < 6) {
    strength.classList.add("weak");
  } else if (/[A-Z]/.test(val) && /[0-9]/.test(val)) {
    strength.classList.add("medium");
  } else if (/[^A-Za-z0-9]/.test(val)) {
    strength.classList.add("strong");
  }
});



const themeBtn = document.getElementById("themeBtn");

themeBtn.onclick = () => {
  document.body.classList.toggle("dark");

  themeBtn.textContent =
    document.body.classList.contains("dark") ? "☀️" : "🌙";
};
</script>

</body>
</html>
