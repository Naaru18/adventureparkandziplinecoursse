<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoZip Login</title>

  <link rel="icon" href="../Images/leaf.png">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- TOP CONTROLS -->
<div class="top-controls">
  <button id="themeBtn">🌙</button>
  <button id="rtlBtn">RTL</button>
</div>

<div class="auth-container">

  <!-- CLICKABLE LOGO -->
  <a href="../index/index.html" class="brand">
    <div class="logo-icon"><i class="fas fa-leaf"></i></div>
    <div>
      <h1>EcoZip</h1>
      <span>Adventure</span>
    </div>
  </a>

  <p class="tagline">Welcome back! Continue your journey.</p>

  <form class="auth-form">

    <h2>Login</h2>

    <!-- EMAIL -->
    <div class="input-group">
      <input type="email" placeholder="Email address" required>
    </div>

    <!-- PASSWORD -->
    <div class="input-group password-group">
      <input type="password" id="password" placeholder="Password" required>
      <span class="toggle-password" data-target="password">
        <i class="fa-regular fa-eye"></i>
      </span>
    </div>

    <!-- OPTIONS -->
    <div class="options">
      <label class="checkbox">
        <input type="checkbox">
        <span></span>
        Remember me
      </label>

      <a href="#">Forgot password?</a>
    </div>

    <!-- PRIMARY BUTTON -->
    <button type="submit" class="btn-primary">Login</button>

    <!-- SOCIAL (CLEAN, NO LINE) -->
    <div class="social">
      <button class="social-btn google">
        <i class="fab fa-google"></i>
        Continue with Google
      </button>

      <button class="social-btn apple">
        <i class="fab fa-apple"></i>
        Continue with Apple
      </button>
    </div>

    <p class="switch-text">
      Don’t have an account?
      <a href="../login/register.html">Sign up</a>
    </p>

  </form>

</div>

<script>
  // PASSWORD TOGGLE
document.querySelectorAll(".toggle-password").forEach(icon => {
  icon.onclick = () => {
    const input = document.getElementById(icon.dataset.target);
    input.type = input.type === "password" ? "text" : "password";
  };
});

// DARK MODE
document.getElementById("themeBtn").onclick = () => {
  document.body.classList.toggle("dark");
};

// RTL
document.getElementById("rtlBtn").onclick = () => {
  document.documentElement.dir =
    document.documentElement.dir === "rtl" ? "ltr" : "rtl";
};
</script>

</body>
</html>
